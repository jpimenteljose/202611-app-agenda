<h4 class="text-primary">Dashboard Principal</h4>
<p>Consulte e visualize o resumo de sua agenda</p>

<form [formGroup]="formDashboard" (ngSubmit)="gerarGraficos()">

    <div class="row mb-3">
        <div class="col-md-3">
            <input type="date" class="form-control" formControlName="dataMin"/>
        </div>
        <div class="col-md-3">
            <input type="date" class="form-control" formControlName="dataMax"/>
        </div>
        <div class="col-md-6">
            <input type="submit" class="btn btn-success shadow" value="Aplicar filtro"
                [disabled]="formDashboard.invalid"/>
        </div>
    </div>

</form>

<div class="row mt-3">
    <div class="col-md-6">
        <div [chart]="graficoDonut()"></div>
    </div>
    <div class="col-md-6">
        <div [chart]="graficoColuna()"></div>
    </div>
</div>
